[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geo-automated-downloader-archiver"
version = "0.1.0"
description = "Automated download and archive tool for geostationary satellite cloud data"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "psutil>=5.9",
    "netCDF4>=1.6",
    "eumdac>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
geo-archiver-dashboard = "geo_downloader.geo_ring_cloud_transfer_dashboard:main"
geo-archiver-download = "geo_downloader.geo_cloud_downloader:main"
geo-archiver-upload = "geo_downloader.geo_ring_cloud_auto_uploader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geo_downloader = ["*.html", "*.md", "*.ps1"]

[tool.pytest.ini_options]
testpaths = ["src/geo_downloader/tests"]
