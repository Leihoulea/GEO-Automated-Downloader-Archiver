[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geo-automated-downloader-archiver"
version = "0.1.0"
description = "Automated download and archive tool for geostationary satellite cloud data"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/geo_downloader/tests"]
